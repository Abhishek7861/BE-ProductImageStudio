spring.application.name=ProductImageStudio

server.port=${PORT:8080}

#Cookie SameSite for cross-origin
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

# Postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_image_studio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# RUNPOD
runpod.base-url=https://api.runpod.ai/v2/
runpod.api-key=${RUNPOD_API_KEY:Dummy}
runpod.endpoint-id=qwen-image-edit-2511-lora


#GCP
gcp.storage.bucket-name=product-image-studio
gcp.storage.project-id=${GCP_PROJECT_ID:}
gcp.storage.signer-sa-email=${GCP_SIGNER_SA_EMAIL:}

#GOOGLE OAUTH
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid, profile, email

# Frontend URL used for OAuth redirect and CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Include the exception message in error JSON so the SPA can display it.
server.error.include-message=always
server.forward-headers-strategy=native
