services:
  postgres:
    image: postgres:16-alpine
    container_name: pis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_image_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: